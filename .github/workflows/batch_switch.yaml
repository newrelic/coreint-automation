name: Switch release flow (batch / existing)

# Switches the integrations that have the batch workflows (batch_automated_release, batch_on_prerelease, batch_on_release)
# between the existing release flow and the batch flow. Both sets of workflows listen to the same events, so only one of
# them can be enabled at a time. The workflow files are not touched, they are enabled or disabled like in the Actions settings.
#
# mode=batch:    disables the existing workflows, enables the batch ones and unblocks automatic_release_enable_batch.
# mode=existing: blocks automatic_release_enable_batch, disables the batch workflows and enables the existing ones.
#
# Run it with mode=batch before the batch workflows are merged in a repo to avoid both flows running on the first event:
# a batch workflow that is not in the repository yet is skipped, and it is enabled by default once merged.
# COREINT_BOT_TOKEN needs the 'actions: write' permission on the repositories.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Flow to switch to
        type: choice
        options:
          - batch
          - existing
        required: true
      repos:
        description: Comma separated repositories of the newrelic org
        type: string
        required: false
        default: nri-apache,nri-f5,nri-nagios

env:
  SWITCH_FILE_NAME: automatic_release_enable_batch
  BRANCH: gh-pages
  EXISTING_WORKFLOWS: automated_release.yaml on_prerelease.yaml on_release.yaml
  BATCH_WORKFLOWS: batch_automated_release.yaml batch_on_prerelease.yaml batch_on_release.yaml

jobs:
  switch:
    name: Switch to ${{ inputs.mode }}
    runs-on: ubuntu-latest
    permissions:
      # Allows github.token to push the switch file to gh-pages
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Switch the workflows
        env:
          GH_TOKEN: ${{ secrets.COREINT_BOT_TOKEN }}
        run: |
          set -u
          if [ "${{ inputs.mode }}" = batch ]; then off="$EXISTING_WORKFLOWS"; on="$BATCH_WORKFLOWS"; else off="$BATCH_WORKFLOWS"; on="$EXISTING_WORKFLOWS"; fi
          failed=0
          for repo in $(echo "${{ inputs.repos }}" | tr ',' ' '); do
            # the flow that is left is disabled first, so there is no moment with both enabled
            for wf in $off; do
              if out=$(gh workflow disable "$wf" -R "newrelic/$repo" 2>&1); then
                echo "$repo: disabled $wf"
              elif grep -q "could not find any workflows" <<<"$out"; then
                echo "::warning::$repo: $wf not found, skipped"
              else
                echo "::error::$repo: cannot disable $wf: $out"; failed=1
              fi
            done
            for wf in $on; do
              if out=$(gh workflow enable "$wf" -R "newrelic/$repo" 2>&1); then
                echo "$repo: enabled $wf"
              elif grep -q "could not find any workflows" <<<"$out"; then
                echo "::warning::$repo: $wf not found, skipped (it is enabled when merged)"
              else
                echo "::error::$repo: cannot enable $wf: $out"; failed=1
              fi
            done
          done
          exit $failed

      - name: Set the batch switch file
        run: |
          if [ "${{ inputs.mode }}" = batch ]; then
            echo "Removing/renaming this file will block automatic releases." > "$SWITCH_FILE_NAME"
          else
            rm -f "$SWITCH_FILE_NAME"
          fi
          git config user.name newrelic-coreint-bot
          git config user.email coreint-dev@newrelic.com
          git add -A
          git diff --cached --quiet && echo "Switch file already up to date" && exit 0
          git commit -m "Switch release flow to ${{ inputs.mode }}"
          git push origin HEAD:${{ env.BRANCH }}

      - name: Summary
        run: |
          echo "Release flow of ${{ inputs.repos }} is now **${{ inputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"
