name: Batch publish

# First step of the batch S3 publish flow: scan the opted-in repos for pending
# pre-releases and build one queue entry (JSON) per integration.
# Nothing is written to S3 yet; the entries are uploaded as a workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan repos for pending pre-releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build queue entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/scan_prereleases.sh .github/batch/repos.json batch-queue/pending

      - name: Summary
        run: |
          {
            echo "### Pending pre-releases"
            echo
            if compgen -G "batch-queue/pending/*.json" > /dev/null; then
              echo "| Repo | Tag | FIPS | Schema | Config verified |"
              echo "|---|---|---|---|---|"
              jq -rs '.[] | "| \(.repo_name) | \(.tag) | \(.upload_fips_packages) | \(.publish_schema) | \(.config_verified) |"' batch-queue/pending/*.json
            else
              echo "No pending pre-releases."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload queue entries
        uses: actions/upload-artifact@v4
        with:
          name: batch-queue-pending
          path: batch-queue/pending/
          if-no-files-found: ignore
