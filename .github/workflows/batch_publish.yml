name: Batch publish

# First step of the batch S3 publish flow: scan the opted-in repos for pending
# pre-releases and build one queue file (JSON) split into pending (pre-release waiting for prod) and done.
# Nothing is written to S3 yet; the file is uploaded as a workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan repos for pending pre-releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build queue file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/scan_prereleases.sh .github/batch/repos.json batch-queue/queue.json

      - name: Summary
        run: |
          {
            echo "### Batch queue"
            echo
            echo "| State | Repo | Tag | FIPS | Schema | Config verified |"
            echo "|---|---|---|---|---|---|"
            jq -r '(.pending[] | ["pending"] + [.repo_name, .tag, .upload_fips_packages, .publish_schema, .config_verified]),
                   (.done[]    | ["done"]    + [.repo_name, .tag, .upload_fips_packages, .publish_schema, .config_verified])
                   | "| " + (map(tostring) | join(" | ")) + " |"' batch-queue/queue.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload queue file
        uses: actions/upload-artifact@v4
        with:
          name: batch-queue
          path: batch-queue/queue.json
