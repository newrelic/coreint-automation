# Switch of the integrations that publish to S3 with the batch workflows (batch_publish_*). It is separate from
# the global switch of block.yaml / unblock.yaml. Without the file the batch repos do not create releases.
name: Block automatic releases (batch)

on:
  workflow_dispatch:

env:
  UNBLOCK_FILE_NAME: automatic_release_enable_batch
  BRANCH: gh-pages

jobs:
  unblock:
    name: Disable Automatic Releases (batch)
    runs-on: ubuntu-latest
    permissions:
      # Allows github.token to push commit
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - name: remove unblock file
        run: rm -f ${{ env.UNBLOCK_FILE_NAME }}
      - name: Configure Git
        run: |
          git config user.name newrelic-coreint-bot
          git config user.email coreint-dev@newrelic.com
      - name: Commit file remove
        run: |
          git add -A
          git diff --cached --quiet && echo "Nothing to change" && exit 0
          git commit -m "Disable automatic releases (batch)"
          git push origin HEAD:${{ env.BRANCH }}
